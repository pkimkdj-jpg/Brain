<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: show; width: 100vw; height: 100vh; }
canvas { position: fixed; top: 0; right: 0; z-index: 0; }
model-viewer#brainModel {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 1;
  width: 100%;
  height: 100vh;
  background: transparent;
  overflow: visible;
  transform: translateX(650px);
}
.Hotspot {
  border: none;
  cursor: pointer;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  padding: 0;
  position: relative;
  transition: opacity 0.3s ease;
}
.Hotspot[data-visibility-attribute="hidden"] {
  opacity: 0;
  pointer-events: none;
}
.hotspot-tag {
  position: absolute;
  left: calc(100% + 20px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  padding: 12px 24px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 1);
  color: #000000;
  font-family: -apple-system, system-ui, sans-serif;
  font-size: 24px;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  pointer-events: auto;
}
.hotspot-label {
  position: absolute;
  left: calc(100% + 20px);
  top: calc(50% + 32px);
  white-space: nowrap;
  font-family: -apple-system, system-ui, sans-serif;
  font-size: 18px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.5);
  pointer-events: none;
}
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: calc(100vw + 500px);
  height: 100vh;
  background: rgba(0, 0, 0, 0.8);
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}
.info-card {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%) translateY(20px);
  z-index: 10;
  width: 1000px;
  max-height: calc(80vh - 64px);
  overflow-y: auto;
  padding: 60px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
  display: flex;
  flex-direction: column;
  gap: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  font-family: -apple-system, system-ui, sans-serif;
  text-align: center;
}
.info-card.visible {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(20);
  pointer-events: auto;
}
.info-card .card-title {
  font-size: 48px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1.2;
}
.info-card .card-body {
  font-size: 32px;
  color: #ffffff;
  line-height: 1.5;
}
#cardMarker {
  position: fixed;
  width: 140px;
  height: 140px;
  z-index: 11;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
  --poster-color: transparent;
  pointer-events: none;
  opacity: 0;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<model-viewer
  id="brainModel"
  src="brain-and-particles_02.glb"
  alt="3D Brain Model"
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="10deg"
  camera-controls
  disable-zoom
  tone-mapping="neutral"
  interpolation-decay="150"
  interaction-prompt="none"
  camera-orbit="0deg 75deg 3.6m"
  camera-target="0m 0m 0m"
  disable-tap="true"
  min-camera-orbit="auto auto 1.5m"
  max-camera-orbit="auto auto 3.6m"
  shadow-intensity=".4"
  shadow-softness="1"
  reveal="auto"
  style="height:100vh; background:transparent;">

  <button class="Hotspot" slot="hotspot-1"
    data-position="0.012401781963188488m 0.409746206926197m 0.4529444967460694m"
    data-normal="-0.946724679814142m 0.3200486604443565m -0.03579435121054289m"
    data-visibility-attribute="visible"
    data-orbit="0deg 100deg 2m"
    data-title="Frontal lobe"
    data-body="The frontal lobe is often called the brain's executive command center. Its structures are often associated with planning, decision-making, problem-solving, self-control, and creative thinking. It helps us weigh consequences and make thoughtful choices. Understanding the frontal lobe helps businesses understand the customer choice. Because this area can be overwhelmed by too many options, simplifying the decision-making process can improve outcomes. Brands often offer curated starter packs, which can help reduce cognitive load and make choosing products, goods, and services easier on a customer or client.">
    <span class="hotspot-tag">Tap me</span>
    <span class="hotspot-label">Frontal Lobe</span>
  </button>

  <button class="Hotspot" slot="hotspot-2"
    data-position="-0.028843040370754497m 0.6171459400421728m -0.01367390218958009m"
    data-normal="0.21954866131212403m 0.9655269342781055m -0.1398432139918739m"
    data-visibility-attribute="visible"
    data-orbit="60deg 60deg 2m"
    data-title="Parietal lobe"
    data-body="The parietal lobe contains the parts of the brain that process sensory information like touch, temperature, pressure, and vibration. It also supports spatial awareness—helping us understand where our body is in relation to the world around us. The parietal lobe is central to user experience (UX) and physical product design. A product that feels good to hold, or a website that is intuitive to navigate, creates positive sensory and spatial feedback. This can influence a client's viewpoint of product, increasing satisfaction and adoption.">
    <span class="hotspot-tag">Tap me</span>
    <span class="hotspot-label">Parietal Lobe</span>
  </button>

  <button class="Hotspot" slot="hotspot-3"
    data-position="0.5065181228253581m 0.10398142542386934m 0.04968649733472076m"
    data-normal="0.896667412786779m 0.18997851731302384m 0.39986962100891027m"
    data-visibility-attribute="visible"
    data-orbit="0deg 75deg 1.5m"
    data-title="Temporal lobe"
    data-body="The temporal lobe contains the structures that process sound and supports key functions in the formations of memory. It helps us understand speech, music, and other qualities of sound while also playing a major role in long-term memory. The temporal lobe's connection to sound and memory makes it powerful for branding and recognition. A catchy jingle, signature brand sound, or compelling story can become embedded in a client's memory. This strengthens brand recall and can make it more likely to be chosen later.">
    <span class="hotspot-tag">Tap me</span>
    <span class="hotspot-label">Temporal Lobe</span>
  </button>

  <button class="Hotspot" slot="hotspot-4"
    data-position="-0.025538709154125094m -0.031100848950056603m -0.6444561738806058m"
    data-normal="0.5179811669506944m -0.12637329827055413m -0.8460054965357012m"
    data-visibility-attribute="visible"
    data-orbit="200deg 110deg 2m"
    data-title="Occipital lobe"
    data-body="The occipital lobe is the brain's main visual processing center. It interprets information from the eyes, helping us recognize shapes, colors, and movement. First impressions are often visual, and the occipital lobe is the seat of that response. Strong visuals, packaging design, store layout, or websites can create immediate positive associations. This visual appeal can directly influence a client's mindset before they even interact with a product or service.">
    <span class="hotspot-tag">Tap me</span>
    <span class="hotspot-label">Occipital Lobe</span>
  </button>

  <button class="Hotspot" slot="hotspot-5"
    data-position="-0.15133791675024755m -0.20408247443933836m -0.017788147639660218m"
    data-normal="-0.3935625262894316m -0.8037286843419246m 0.4462384338744023m"
    data-visibility-attribute="visible"
    data-orbit="0deg 110deg 2m"
    data-title="Limbic system"
    data-body="While not a true anatomical lobe, the limbic system is a collection of individual structures like the hippocampus and amygdala. It plays a central role in emotion, motivation, memory, and gut feelings. People are wired to make decisions with emotion and justify with logic later. The limbic system is where that emotional response begins. Brands that explore emotional connection—through inspiring marketing, strong service, or a meaningful mission—can build loyalty that goes beyond price or features. This emotional bond is central to human-centric business and long-term customer relationships.">
    <span class="hotspot-tag">Tap me</span>
    <span class="hotspot-label">Limbic System</span>
  </button>

  <div slot="progress-bar"></div>
</model-viewer>

<div class="overlay" id="overlay"></div>
<div class="info-card" id="infoCard">
  <div class="card-title" id="cardTitle"></div>
  <div class="card-body" id="cardBody"></div>
</div>
<model-viewer id="cardMarker" data-src="Ignition-Start_Symbol.glb" interaction-prompt="none" disable-zoom disable-pan disable-tap shadow-intensity="0" camera-orbit="0deg 80deg 200%" min-camera-orbit="auto auto 200%" max-camera-orbit="auto auto 200%"><div slot="progress-bar"></div></model-viewer>

<script>
const model = document.getElementById('brainModel');
const hotspots = document.querySelectorAll('.Hotspot');
const card = document.getElementById('infoCard');
const overlay = document.getElementById('overlay');
const cardTitle = document.getElementById('cardTitle');
const cardBody = document.getElementById('cardBody');
const cardMarker = document.getElementById('cardMarker');
const defaultOrbit = '0deg 75deg 3.6m';
const MARKER_SIZE = 140;
const MARKER_GAP = 80;
let activeHotspot = null;
let zoomTimeout = null;

function positionCardMarker() {
  const targetLeft = innerWidth * 0.5 - MARKER_SIZE / 2;
  const targetTop = Math.min(innerHeight - MARKER_SIZE - 12, innerHeight * 0.40 + card.offsetHeight / 2 + MARKER_GAP);
  cardMarker.style.left = targetLeft + 'px';
  cardMarker.style.top = targetTop + 'px';
  return { targetLeft, targetTop };
}

function flyMarkerFrom(hotspot) {
  positionCardMarker();
  cardMarker.style.transition = 'none';
  cardMarker.style.transform = 'scale(0)';
  cardMarker.style.opacity = '1';
  cardMarker.getBoundingClientRect();
  cardMarker.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease';
  cardMarker.style.transform = 'none';
  cardMarker.setAttribute('rotation-per-second', '10deg');
  cardMarker.setAttribute('auto-rotate-delay', '0');
  cardMarker.setAttribute('auto-rotate', '');
}

function dismissCardMarker() {
  cardMarker.style.opacity = '0';
  cardMarker.removeAttribute('auto-rotate');
}

function animateToOrbit(targetOrbit, hotspot) {
  if (zoomTimeout) clearTimeout(zoomTimeout);

  const parts = targetOrbit.split(' ');
  const azimuth = parts[0];
  const polar = parts[1];
  const finalDistance = parseFloat(parts[2]);
  const pullbackDistance = finalDistance + 1.2;
  const intermediateOrbit = azimuth + ' ' + polar + ' ' + pullbackDistance + 'm';

  model.cameraOrbit = intermediateOrbit;

  zoomTimeout = setTimeout(() => {
    model.cameraOrbit = targetOrbit;
    zoomTimeout = setTimeout(() => {
      showCard(hotspot);
    }, 450);
  }, 600);
}

function showCard(hotspot) {
  cardTitle.textContent = hotspot.getAttribute('data-title') || '';
  cardBody.textContent = hotspot.getAttribute('data-body') || '';
  card.scrollTop = 0;
  card.classList.add('visible');
  overlay.classList.add('visible');
  flyMarkerFrom(hotspot);
}

function hideCard() {
  card.classList.remove('visible');
  overlay.classList.remove('visible');
  dismissCardMarker();
}

function reset() {
  if (zoomTimeout) clearTimeout(zoomTimeout);
  model.cameraOrbit = defaultOrbit;
  model.setAttribute('auto-rotate', '');
  activeHotspot = null;
  hideCard();
}

hotspots.forEach(hotspot => {
  hotspot.addEventListener('click', (e) => {
    e.stopPropagation();
    const orbit = hotspot.getAttribute('data-orbit');
    if (activeHotspot === hotspot) {
      reset();
    } else {
      if (zoomTimeout) clearTimeout(zoomTimeout);
      hideCard();
      model.removeAttribute('auto-rotate');
      activeHotspot = hotspot;
      animateToOrbit(orbit, hotspot);
    }
  });
});

let markersLoaded = false;
function loadMarkers() {
  if (markersLoaded) return;
  markersLoaded = true;
  document.querySelectorAll('model-viewer[data-src]').forEach((m, i) => {
    setTimeout(() => {
      m.setAttribute('src', m.dataset.src);
    }, i * 200);
  });
}
model.addEventListener('load', loadMarkers, { once: true });
setTimeout(loadMarkers, 8000);

addEventListener('resize', () => {
  if (activeHotspot) positionCardMarker();
});

model.addEventListener('click', (e) => {
  if (!e.target.closest('.Hotspot')) {
    reset();
  }
});

overlay.addEventListener('click', () => {
  reset();
});
</script>
</body>
</html>

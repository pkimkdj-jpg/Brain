<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: show; width: 100vw; height: 100vh; }
  canvas { position: fixed; top: 0; right: 0; z-index: 0; }
  model-viewer {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 1;
    width: 100%;
    height: 100vh;
    background: transparent;
    overflow: visible;
  }

  .Hotspot {
    border: none;
    cursor: pointer;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    padding: 0;
    position: relative;
  }

  .Hotspot[data-visibility-attribute="hidden"] {
    opacity: 0;
    pointer-events: none;
  }

  .hotspot-tag {
    position: absolute;
    left: calc(100% + 20px);
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 1);
    color: #000000;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 24px;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    pointer-events: auto;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .info-card {
    position: fixed;
    top: 50%;
    left: 52%;
    transform: translate(-50%, -50%) translateY(20px);
    z-index: 10;
    width: 1000px;
    max-height: calc(100vh - 128px);
    overflow-y: auto;
    padding: 60px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    gap: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-family: -apple-system, system-ui, sans-serif;
  }

  .info-card.visible {
    opacity: 1;
    transform: translate(-50%, -50%) translateY(0);
    pointer-events: auto;
  }

  .info-card .card-title {
    font-size: 48px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.2;
  }

  .info-card .card-body {
    font-size: 32px;
    color: #ffffff;
    line-height: 1.5;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<model-viewer
  id="brainModel"
  src="brain-and-particles_01.glb"
  alt="3D Brain Model"
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="15deg"
  camera-controls
  interaction-prompt="none"
  camera-orbit="0deg 75deg 4m"
  camera-target="0m 0m 0m"
  disable-tap="true"
  min-camera-orbit="auto auto 2m"
  max-camera-orbit="auto auto 4m"
  shadow-intensity="3"
  reveal="auto"
  style="height:100vh; background:transparent;">

  <button class="Hotspot" slot="hotspot-1"
    data-surface="5 0 21784 21803 21802 323.157 -270.663 -51.494"
    data-visibility-attribute="visible"
    data-orbit="0deg 100deg 2m"
    data-title="Title_1"
    data-body="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-2"
    data-surface="4 0 27376 27377 27375 164.132 -11.268 -151.864"
    data-visibility-attribute="visible"
    data-orbit="60deg 60deg 2m"
    data-title="Title_2"
    data-body="Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem. Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur. Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur. At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-3"
    data-surface="3 0 62227 62233 62239 31.854 -12.250 -18.603"
    data-visibility-attribute="visible"
    data-orbit="0deg 75deg 1.5m"
    data-title="Title_3"
    data-body="Similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus. Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae. Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-4"
    data-surface="1 0 33456 33457 33455 110.097 -60.006 -49.092"
    data-visibility-attribute="visible"
    data-orbit="200deg 110deg 2m"
    data-title="Title_4"
    data-body="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Quis ipsum suspendisse ultrices gravida. Risus commodo viverra maecenas accumsan lacus vel facilisis. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Curabitur pretium tincidunt lacus, eu sollicitudin orci fermentum nec.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <div slot="progress-bar"></div>

</model-viewer>

<div class="overlay" id="overlay"></div>

<div class="info-card" id="infoCard">
  <div class="card-title" id="cardTitle"></div>
  <div class="card-body" id="cardBody"></div>
</div>

<script>
  const model = document.getElementById('brainModel');
  const hotspots = document.querySelectorAll('.Hotspot');
  const card = document.getElementById('infoCard');
  const overlay = document.getElementById('overlay');
  const cardTitle = document.getElementById('cardTitle');
  const cardBody = document.getElementById('cardBody');
  const defaultOrbit = '0deg 75deg 4m';
  let activeHotspot = null;

  function showCard(hotspot) {
    cardTitle.textContent = hotspot.getAttribute('data-title') || '';
    cardBody.textContent = hotspot.getAttribute('data-body') || '';
    card.scrollTop = 0;
    card.classList.add('visible');
    overlay.classList.add('visible');
  }

  function hideCard() {
    card.classList.remove('visible');
    overlay.classList.remove('visible');
  }

  function reset() {
    model.cameraOrbit = defaultOrbit;
    model.setAttribute('auto-rotate', '');
    activeHotspot = null;
    hideCard();
  }

  hotspots.forEach(hotspot => {
    hotspot.addEventListener('click', (e) => {
      e.stopPropagation();
      const orbit = hotspot.getAttribute('data-orbit');
      if (activeHotspot === hotspot) {
        reset();
      } else {
        model.removeAttribute('auto-rotate');
        model.cameraOrbit = orbit;
        activeHotspot = hotspot;
        showCard(hotspot);
      }
    });
  });

  model.addEventListener('click', (e) => {
    if (!e.target.closest('.Hotspot')) {
      reset();
    }
  });

  overlay.addEventListener('click', () => {
    reset();
  });
</script>

</body>
</html>

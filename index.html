<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: fixed; top: 0; right: 0; z-index: 0; }
model-viewer#brainModel {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 1;
  width: 100%;
  height: 100vh;
  background: transparent;
  overflow: visible;
}
.Hotspot {
  border: none;
  cursor: pointer;
  width: 100px;
  height: 100px;
  background: transparent;
  padding: 0;
  position: relative;
  transition: opacity 0.3s ease;
}
.Hotspot[data-visibility-attribute="hidden"] {
  opacity: 0;
  pointer-events: none;
}
.Hotspot .marker {
  width: 100%;
  height: 100%;
  background: transparent;
  --poster-color: transparent;
  pointer-events: none;
  display: block;
  transition: opacity 0.25s ease;
}
.Hotspot.marker-away .marker {
  opacity: 0;
}
.hotspot-tag {
  position: absolute;
  left: calc(100% + 20px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  padding: 12px 24px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 1);
  color: #000000;
  font-family: -apple-system, system-ui, sans-serif;
  font-size: 24px;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  pointer-events: auto;
}
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.8);
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}
.info-card {
  position: fixed;
  top: 40%;
  left: 52%;
  transform: translate(-50%, -50%) translateY(20px);
  z-index: 10;
  width: 1000px;
  max-height: calc(80vh - 64px);
  overflow-y: auto;
  padding: 60px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
  display: flex;
  flex-direction: column;
  gap: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  font-family: -apple-system, system-ui, sans-serif;
}
.info-card.visible {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(0);
  pointer-events: auto;
}
.info-card .card-title {
  font-size: 48px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1.2;
}
.info-card .card-body {
  font-size: 32px;
  color: #ffffff;
  line-height: 1.5;
}
#cardMarker {
  position: fixed;
  width: 140px;
  height: 140px;
  z-index: 11;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
  --poster-color: transparent;
  pointer-events: none;
  opacity: 0;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<model-viewer
  id="brainModel"
  src="brain-and-particles_02.glb"
  alt="3D Brain Model"
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="10deg"
  camera-controls
  tone-mapping="neutral"
  interaction-prompt="none"
  camera-orbit="0deg 75deg 4m"
  camera-target="0m 0m 0m"
  disable-tap="true"
  min-camera-orbit="auto auto 2m"
  max-camera-orbit="auto auto 4m"
  shadow-intensity=".4"
  shadow-softness="1"
  reveal="auto"
  style="height:100vh; background:transparent;">

  <button class="Hotspot" slot="hotspot-1"
    data-position="0.10952934089899875m 0.2657627462439013m 0.6429173041497362m"
    data-normal="0.1347320968094432m 0.29953153499994467m 0.944525341973368m"
    data-visibility-attribute="visible"
    data-orbit="0deg 100deg 2m"
    data-title="Title_1"
    data-body="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.">
    <model-viewer class="marker" data-src="Ignition-Start_Symbol.glb" interaction-prompt="none" disable-zoom disable-pan disable-tap shadow-intensity="0" camera-orbit="0deg 80deg 105%"><div slot="progress-bar"></div></model-viewer>
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-2"
    data-position="0.35316316704069894m 0.40796299691375215m 0.050265408187523786m"
    data-normal="0.48632780493260064m 0.6681672736269391m 0.5630610629437819m"
    data-visibility-attribute="visible"
    data-orbit="60deg 60deg 2m"
    data-title="Title_2"
    data-body="Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem. Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur. Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur.">
    <model-viewer class="marker" data-src="Ignition-Start_Symbol.glb" interaction-prompt="none" disable-zoom disable-pan disable-tap shadow-intensity="0" camera-orbit="0deg 80deg 105%"><div slot="progress-bar"></div></model-viewer>
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-3"
    data-position="0.09651866620457028m -0.22834789425857005m -0.4931272667918698m"
    data-normal="0.22734451241678114m -0.9463901633838512m -0.2294779538959327m"
    data-visibility-attribute="visible"
    data-orbit="0deg 75deg 1.5m"
    data-title="Title_3"
    data-body="Similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus.">
    <model-viewer class="marker" data-src="Ignition-Start_Symbol.glb" interaction-prompt="none" disable-zoom disable-pan disable-tap shadow-intensity="0" camera-orbit="0deg 80deg 105%"><div slot="progress-bar"></div></model-viewer>
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-4"
    data-position="-0.48979458195321346m 0.18927659381263034m -0.17160652392071685m"
    data-normal="-0.7430749108276329m -0.5017101221240192m 0.4428618636288375m"
    data-visibility-attribute="visible"
    data-orbit="200deg 110deg 2m"
    data-title="Title_4"
    data-body="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Quis ipsum suspendisse ultrices gravida. Risus commodo viverra maecenas accumsan lacus vel facilisis. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.">
    <model-viewer class="marker" data-src="Ignition-Start_Symbol.glb" interaction-prompt="none" disable-zoom disable-pan disable-tap shadow-intensity="0" camera-orbit="0deg 80deg 105%"><div slot="progress-bar"></div></model-viewer>
    <span class="hotspot-tag">Tap me</span>
  </button>

  <div slot="progress-bar"></div>
</model-viewer>

<div class="overlay" id="overlay"></div>
<div class="info-card" id="infoCard">
  <div class="card-title" id="cardTitle"></div>
  <div class="card-body" id="cardBody"></div>
</div>
<model-viewer id="cardMarker" data-src="Ignition-Start_Symbol.glb" interaction-prompt="none" disable-zoom disable-pan disable-tap shadow-intensity="0" camera-orbit="0deg 80deg 200%" min-camera-orbit="auto auto 200%" max-camera-orbit="auto auto 200%"><div slot="progress-bar"></div></model-viewer>

<script>
const model = document.getElementById('brainModel');
const hotspots = document.querySelectorAll('.Hotspot');
const card = document.getElementById('infoCard');
const overlay = document.getElementById('overlay');
const cardTitle = document.getElementById('cardTitle');
const cardBody = document.getElementById('cardBody');
const cardMarker = document.getElementById('cardMarker');
const defaultOrbit = '0deg 75deg 4m';
const MARKER_SIZE = 140;
const MARKER_GAP = 80;
let activeHotspot = null;

function positionCardMarker() {
  const targetLeft = innerWidth * 0.52 - MARKER_SIZE / 2;
  const targetTop = Math.min(innerHeight - MARKER_SIZE - 12, innerHeight * 0.40 + card.offsetHeight / 2 + MARKER_GAP);
  cardMarker.style.left = targetLeft + 'px';
  cardMarker.style.top = targetTop + 'px';
  return { targetLeft, targetTop };
}

function flyMarkerFrom(hotspot) {
  const srcMarker = hotspot.querySelector('.marker');
  const r = srcMarker.getBoundingClientRect();
  const { targetLeft, targetTop } = positionCardMarker();
  const dx = (r.left + r.width / 2) - (targetLeft + MARKER_SIZE / 2);
  const dy = (r.top + r.height / 2) - (targetTop + MARKER_SIZE / 2);
  const startScale = r.width / MARKER_SIZE;

  hotspot.classList.add('marker-away');
  cardMarker.style.transition = 'none';
  cardMarker.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + startScale + ')';
  cardMarker.style.opacity = '1';
  cardMarker.getBoundingClientRect();
  cardMarker.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease';
  cardMarker.style.transform = 'none';
  cardMarker.setAttribute('rotation-per-second', '10deg');
  cardMarker.setAttribute('auto-rotate-delay', '0');
  cardMarker.setAttribute('auto-rotate', '');
}

function dismissCardMarker() {
  cardMarker.style.opacity = '0';
  cardMarker.removeAttribute('auto-rotate');
  hotspots.forEach(h => h.classList.remove('marker-away'));
}

function showCard(hotspot) {
  cardTitle.textContent = hotspot.getAttribute('data-title') || '';
  cardBody.textContent = hotspot.getAttribute('data-body') || '';
  card.scrollTop = 0;
  card.classList.add('visible');
  overlay.classList.add('visible');
  flyMarkerFrom(hotspot);
}

function hideCard() {
  card.classList.remove('visible');
  overlay.classList.remove('visible');
  dismissCardMarker();
}

function reset() {
  model.cameraOrbit = defaultOrbit;
  model.setAttribute('auto-rotate', '');
  activeHotspot = null;
  hideCard();
}

hotspots.forEach(hotspot => {
  hotspot.addEventListener('click', (e) => {
    e.stopPropagation();
    const orbit = hotspot.getAttribute('data-orbit');
    if (activeHotspot === hotspot) {
      reset();
    } else {
      model.removeAttribute('auto-rotate');
      model.cameraOrbit = orbit;
      activeHotspot = hotspot;
      showCard(hotspot);
    }
  });
});

/* Deferred marker loading: wait until the brain is fully loaded, then load
   the five marker viewers one at a time so warm-up work never competes
   with the brain's own loading. */
let markersLoaded = false;
function loadMarkers() {
  if (markersLoaded) return;
  markersLoaded = true;
  document.querySelectorAll('model-viewer[data-src]').forEach((m, i) => {
    setTimeout(() => {
      m.setAttribute('src', m.dataset.src);
    }, i * 200);
  });
}
model.addEventListener('load', loadMarkers, { once: true });
setTimeout(loadMarkers, 8000);

addEventListener('resize', () => {
  if (activeHotspot) positionCardMarker();
});

model.addEventListener('click', (e) => {
  if (!e.target.closest('.Hotspot')) {
    reset();
  }
});

overlay.addEventListener('click', () => {
  reset();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020c18; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { position: fixed; top: 0; left: 0; z-index: 0; }
  model-viewer { position: relative; z-index: 1; width: 100%; height: 100vh; background: transparent; }

  .Hotspot {
    border: none;
    cursor: pointer;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: transform 0.2s ease, background 0.2s ease;
    padding: 0;
  }

  .Hotspot:hover {
    transform: scale(1.3);
    background: rgba(255, 255, 255, 0.75);
  }

  .Hotspot[data-visibility-attribute="hidden"] {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<model-viewer
  id="brainModel"
  src="brain_hologram.glb"
  alt="3D Brain Model"
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="20deg"
  camera-controls
  interaction-prompt="none"
  camera-orbit="0deg 75deg 5m"
  camera-target="0m 0m 0m"
  disable-tap="true"
  min-camera-orbit="auto auto 1m"
  max-camera-orbit="auto auto 8m"
  tone-mapping="neutral"
  shadow-intensity="1"
  exposure="0.89"
  style="width:100%; height:100vh; background:transparent;">

    data-visibility-attribute="visible"
    data-orbit="0deg 100deg 2m">
  </button>

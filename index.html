<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: fixed; top: 0; right: 0; z-index: 0; }
model-viewer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 1;
  width: 100%;
  height: 100vh;
  background: transparent;
  overflow: visible;
}
.Hotspot {
  border: none;
  cursor: pointer;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  transition: transform 0.2s ease, background 0.2s ease;
  padding: 0;
  position: relative;
}
.Hotspot:hover {
  transform: scale(1.3);
  background: rgba(255, 255, 255, 1);
}
.Hotspot[data-visibility-attribute="hidden"] {
  opacity: 0;
  pointer-events: none;
}
.hotspot-tag {
  position: absolute;
  left: calc(100% + 20px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  padding: 12px 24px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 1);
  color: #000000;
  font-family: -apple-system, system-ui, sans-serif;
  font-size: 24px;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  pointer-events: auto;
}
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.8);
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}
.info-card {
  position: fixed;
  top: 50%;
  left: 52%;
  transform: translate(-50%, -50%) translateY(20px);
  z-index: 10;
  width: 1000px;
  max-height: calc(100vh - 128px);
  overflow-y: auto;
  padding: 60px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
  display: flex;
  flex-direction: column;
  gap: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  font-family: -apple-system, system-ui, sans-serif;
}
.info-card.visible {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(0);
  pointer-events: auto;
}
.info-card .card-title {
  font-size: 48px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1.2;
}
.info-card .card-body {
  font-size: 32px;
  color: #ffffff;
  line-height: 1.5;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<model-viewer
  id="brainModel"
  src="brain-and-particles_01.glb"
  alt="3D Brain Model"
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="15deg"
  camera-controls
  tone-mapping="neutral"
  interaction-prompt="none"
  camera-orbit="0deg 75deg 4m"
  camera-target="0m 0m 0m"
  disable-tap="true"
  min-camera-orbit="auto auto 2m"
  max-camera-orbit="auto auto 4m"
  shadow-intensity=".3"
  shadow-softness="1.4"
  reveal="auto"
  style="height:100vh; background:transparent;">

  <button class="Hotspot" slot="hotspot-1"
    data-position="-0.09443911928010107m 0.05040162829989736m 0.6046017100454395m"
    data-normal="-0.31008247490596835m 0.32257533893969154m 0.8943120313761482m"
    data-visibility-attribute="visible"
    data-orbit="0deg 100deg 2m"
    data-title="Title_1"
    data-body="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-2"
    data-position="0.36921840268372064m 0.3353212250679697m 0.1862519132128715m"
    data-normal="0.44320249832849085m -0.02095735911199918m 0.896176508604435m"
    data-visibility-attribute="visible"
    data-orbit="60deg 60deg 2m"
    data-title="Title_2"
    data-body="Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem. Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis suscipit laboriosam, nisi ut aliquid ex ea commodi consequatur. Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-3"
    data-position="-0.36983110500892113m 0.43143672315458337m -0.08226516679423418m"
    data-normal="-0.4233964208070058m 0.6549382330712975m 0.6259324098568981m"
    data-visibility-attribute="visible"
    data-orbit="0deg 75deg 1.5m"
    data-title="Title_3"
    data-body="Similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <button class="Hotspot" slot="hotspot-4"
    data-position="0.09066648552104051m -0.1394558880529002m -0.5955244269346154m"
    data-normal="0.27180338683316785m -0.6270414516285077m -0.7300287233017844m"
    data-visibility-attribute="visible"
    data-orbit="200deg 110deg 2m"
    data-title="Title_4"
    data-body="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Quis ipsum suspendisse ultrices gravida. Risus commodo viverra maecenas accumsan lacus vel facilisis. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.">
    <span class="hotspot-tag">Tap me</span>
  </button>

  <div slot="progress-bar"></div>
</model-viewer>

<div class="overlay" id="overlay"></div>
<div class="info-card" id="infoCard">
  <div class="card-title" id="cardTitle"></div>
  <div class="card-body" id="cardBody"></div>
</div>

<script>
const model = document.getElementById('brainModel');
const hotspots = document.querySelectorAll('.Hotspot');
const card = document.getElementById('infoCard');
const overlay = document.getElementById('overlay');
const cardTitle = document.getElementById('cardTitle');
const cardBody = document.getElementById('cardBody');
const defaultOrbit = '0deg 75deg 4m';
let activeHotspot = null;

function showCard(hotspot) {
  cardTitle.textContent = hotspot.getAttribute('data-title') || '';
  cardBody.textContent = hotspot.getAttribute('data-body') || '';
  card.scrollTop = 0;
  card.classList.add('visible');
  overlay.classList.add('visible');
}

function hideCard() {
  card.classList.remove('visible');
  overlay.classList.remove('visible');
}

function reset() {
  model.cameraOrbit = defaultOrbit;
  model.setAttribute('auto-rotate', '');
  activeHotspot = null;
  hideCard();
}

hotspots.forEach(hotspot => {
  hotspot.addEventListener('click', (e) => {
    e.stopPropagation();
    const orbit = hotspot.getAttribute('data-orbit');
    if (activeHotspot === hotspot) {
      reset();
    } else {
      model.removeAttribute('auto-rotate');
      model.cameraOrbit = orbit;
      activeHotspot = hotspot;
      showCard(hotspot);
    }
  });
});

model.addEventListener('click', (e) => {
  if (!e.target.closest('.Hotspot')) {
    reset();
  }
});

overlay.addEventListener('click', () => {
  reset();
});
</script>
</body>
</html>

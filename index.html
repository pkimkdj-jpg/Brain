<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: show; width: 100vw; height: 100vh; }
  canvas { position: fixed; top: 0; right: 0; z-index: 0; }
  model-viewer {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 1;
    width: 100%;
    height: 100vh;
    background: transparent;
    overflow: visible;
  }

  .Hotspot {
    border: none;
    cursor: pointer;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    transition: transform 0.2s ease, background 0.2s ease;
    padding: 0;
    position: relative;
    opacity: 1 !important;
  }

  .Hotspot:hover {
    transform: scale(1.3);
    background: rgba(255, 255, 255, 0.75);
  }

  .Hotspot[data-visibility-attribute="hidden"] {
    opacity: 0 !important;
    pointer-events: none;
  }

  .hotspot-tag {
    position: absolute;
    left: calc(100% + 20px);
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 1);
    color: #000000;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 24px;
    font-weight: 700;
    pointer-events: none;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .info-card {
    position: fixed;
    top: 50%;
    left: 52%;
    transform: translate(-50%, -50%) translateY(20px);
    z-index: 10;
    width: 680px;
    max-height: calc(100vh - 128px);
    overflow-y: auto;
    padding: 48px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    gap: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-family: -apple-system, system-ui, sans-serif;
  }

  .info-card.visible {
    opacity: 1;
    transform: translate(-50%, -50%) translateY(0);
    pointer-events: auto;
  }

  .info-card .card-title {
    font-size: 48px;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.2;
  }

  .info-card .card-body {
    font-size: 24px;
    color: #ffffff;
    line-height: 1.5;
  }
</style>
</head>
